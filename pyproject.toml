[tool.poetry]
name = "mahiru-habits-coursework"
version = "0.6.0"
description = "Coursework project for tracking habits"
authors = ["Mahiru <mahiru@mahiru.com>"]
readme = "README.md"
packages = [{ include = "habits_project" }]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1"
djangorestframework = "^3.14.0"
psycopg2-binary = "^2.9.9"
python-dotenv = "^1.0.0"
redis = "^5.0.1"
celery = "^5.3.6"
djangorestframework-simplejwt = "^5.3.1"
drf-yasg = "^1.21.7"
django-cors-headers = "^4.3.1"
django-celery-beat = "^2.5.0"
requests = "^2.31.0"
dj-database-url = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-django = "^4.7.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
